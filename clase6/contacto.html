    <main>
        <h1>CONTACTO</h1>
        <h2>Escribinos!</h2>
        <!-- FORMULARIO WEB -->
        <!-- https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements -->
        <!-- APRENDER A USAR MDB -->
        
        <form action="./contacto.html" method="post"> <!--action = indica a donde se mandan los datos, metod = como se envian estos datos (get o post)-->
                                                      <!--INVESTIGAR LO DE FORM ACTION='' METHOD=''-->
            <!-- Forma del formulario:
             nombre
             telefono
             mail (servicio a domicilio)
             tamaño - chico, mediano, grande
             direccion
             consulta
            -->
            <label for="">Nombre</label>
            <input type="text" name="Nombre" id="id-nombre"> <!--name = Como se debe comportar-->
            <label for="id-nombre">E-mail</label>
            <input type="email" name="Email" id="id-email">
            <label for="id-email">Telefono</label>
            <input type="tel" name="Telefono" id="id-telefono">

            <select name="tamaño-mascota" id="id-tamaño-mascota">
                <label for="id">Pequeño</label>
                <option value="P">Pequeño</option>
                <label for="id-tamaño-mascota">Mediano</label>
                <option value="M">Mediano</option>
                <label for="">Grande</label>
                <option value="G">Grande</option>
            </select>
            
            <label for="id-direccion">Direccion</label>
            <input type="text" name="direccion" id="id-direccion">
            <label for="id-comentarios">Comentario</label>
            <textarea name="comentarios" id="id-comentarios"></textarea>

            <!-- 2 Formas de poner un boton-
            <input type="submit" value="Enviar"> 
            -->
            <!-- Esta forma de abajo le gusta mas al profe -->
            <button type="submit">Enviar</button>
        </form>
